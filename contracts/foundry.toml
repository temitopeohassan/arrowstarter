[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
broadcast = "broadcast"
optimizer = true
optimizer_runs = 200
ffi = true
evm_version = "paris"
solc_version = "0.8.20"

# Correct remapping for OpenZeppelin
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

# Optional: enable warnings and stack traces
via_ir = false
verbosity = 3
